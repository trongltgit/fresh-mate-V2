name: Build and Sign iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-sign:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Apple Certificate and Provisioning Profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Tạo keychain tạm thời
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Nhập chứng chỉ vào keychain
        echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
        security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Cài đặt Provisioning Profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

    - name: Set up Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build and Archive app
      run: |
        xcodebuild -workspace TenWorkspace.xcworkspace \
          -scheme TenSchemeCuaBan \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $RUNNER_TEMP/App.xcarchive \
          clean archive \
          CODE_SIGN_STYLE="Manual" \
          PROVISIONING_PROFILE_SPECIFIER="Ten_Provisioning_Profile_Cua_Ban" \
          CODE_SIGN_IDENTITY="Apple Distribution: Ten Cong Ty Hoac Ten Ca Nhan"

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/App.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath $RUNNER_TEMP/build
      
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ${{ runner.temp }}/build/*.ipa
